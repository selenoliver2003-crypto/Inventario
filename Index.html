<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Caja y Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concepto: pantalla de caja con marcos gruesos y sombra dura. Productos como etiquetas de precio,
   ticket de venta con totales gigantes, resumen del día arriba y registro de inventario en una barra mínima abajo. */
:root{
  --bg:#E8EFEA;--surface:#FFFFFF;--surface-2:#F2F6F3;--ink:#10211A;--muted:#4D6157;
  --frame:#10211A;--line:#C5D3CA;--shadow-c:#10211A;
  --brand:#2150E8;--on-brand:#FFFFFF;
  --gain:#0A7A43;--gain-bg:#D3F0E0;--warn:#7A5000;--warn-bg:#FFE7B0;--loss:#B3261E;--loss-bg:#FFDAD5;
  --f-display:"Space Grotesk",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1612;--surface:#16231D;--surface-2:#1D2E26;--ink:#E7F1EC;--muted:#A2B8AD;
    --frame:#7E9A8D;--line:#2C4036;--shadow-c:#000000;
    --brand:#7C98FF;--on-brand:#081033;
    --gain:#4FD68E;--gain-bg:#12361F;--warn:#F2C04E;--warn-bg:#3A2D08;--loss:#FF8A80;--loss-bg:#3E1512;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1612;--surface:#16231D;--surface-2:#1D2E26;--ink:#E7F1EC;--muted:#A2B8AD;
  --frame:#7E9A8D;--line:#2C4036;--shadow-c:#000000;
  --brand:#7C98FF;--on-brand:#081033;
  --gain:#4FD68E;--gain-bg:#12361F;--warn:#F2C04E;--warn-bg:#3A2D08;--loss:#FF8A80;--loss-bg:#3E1512;
  color-scheme:dark;
}
*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{
  margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:88px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:1180px;margin:0 auto}
h1,h2,h3,p{margin:0}

/* Encabezado y búsqueda */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-block:12px 10px;display:grid;gap:10px;align-items:center;
  grid-template-columns:1fr auto;grid-template-areas:"b st" "s s";
}
.brand{grid-area:b;font:700 1.4rem/1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.status{grid-area:st;font-size:.8rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status.cloud::before{background:var(--gain)}
.status.local::before,.status.slow::before{background:var(--warn)}
.status.error::before{background:var(--loss)}
.search{grid-area:s;position:relative}
.search input{
  width:100%;height:58px;border:2px solid var(--frame);border-radius:14px;background:var(--surface);color:var(--ink);
  font:600 1.15rem var(--f-body);padding:0 60px 0 50px;box-shadow:3px 3px 0 var(--shadow-c);
}
.search input::placeholder{color:var(--muted);font-weight:500}
.search .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--muted);pointer-events:none}
.mic{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:12px;
  border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center;
}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--loss-bg);border-color:var(--loss);color:var(--loss)}
.name-row{position:relative}
.name-row input{
  width:100%;height:56px;border:2px solid var(--frame);border-radius:14px;background:var(--surface);color:var(--ink);
  font:600 1.1rem var(--f-body);padding:0 58px 0 14px;
}
@media (min-width:900px){
  .top{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"b s st";gap:20px}
}

/* Estructura */
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);padding-top:6px}
.left{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 410px;gap:24px;align-items:start}
}
.frame{background:var(--surface);border:2px solid var(--frame);border-radius:16px;box-shadow:3px 3px 0 var(--shadow-c)}

/* Hoy */
.today{padding:14px 16px}
.today-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.today h2{font:700 1.15rem var(--f-display)}
.date{color:var(--muted);font-size:.9rem;text-transform:capitalize}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.num{background:var(--surface-2);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.num span{display:block;font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.num b{display:block;font:700 clamp(1.7rem,6.5vw,2.3rem)/1.1 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num.gain{background:var(--gain-bg);border-color:var(--gain)}
.num.gain b{color:var(--gain)}
.num.loss{background:var(--loss-bg);border-color:var(--loss)}
.num.loss b{color:var(--loss)}
.meta{margin-top:8px;color:var(--muted);font-size:.92rem}
.link{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.sales{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.sales li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface-2)}
.sales .what{flex:1 1 150px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.sales .what small{display:block;color:var(--muted);font-weight:500}
.sales .amt{font:700 1rem var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.sales .amt small{display:block;color:var(--gain);font-size:.85rem}
.mini{border:2px solid var(--frame);background:var(--surface);border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem}
.mini.warn{background:var(--loss-bg);color:var(--loss);border-color:var(--loss)}

/* Catálogo */
.cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.cat-head h2{font:700 1.15rem var(--f-display)}
.cat-head span{color:var(--muted);font-weight:600;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:128px;min-width:0;
  padding:28px 12px 12px;text-align:left;background:var(--surface);color:var(--ink);
  border:2px solid var(--frame);border-radius:14px;box-shadow:3px 3px 0 var(--shadow-c);
}
.tile .hole{position:absolute;top:9px;left:12px;width:12px;height:12px;border-radius:50%;border:2px solid var(--frame);background:var(--bg)}
.tile .tn{font:700 1.05rem/1.2 var(--f-display);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .tp{margin-top:auto;font:700 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.tile .ts{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--muted)}
.tile .ts.low{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.tile.sel{background:var(--brand);color:var(--on-brand)}
.tile.sel .hole{background:var(--brand);border-color:var(--on-brand)}
.tile.out{opacity:.72}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.empty{padding:22px 18px;display:grid;gap:12px;justify-items:start}
.empty h3{font:700 1.3rem var(--f-display);text-wrap:balance}
.empty p{color:var(--muted);max-width:52ch}
.row-btns{display:flex;flex-wrap:wrap;gap:10px}

/* Botones */
.cta{
  width:100%;min-height:68px;padding:10px 16px;background:var(--brand);color:var(--on-brand);
  border:2px solid var(--frame);border-radius:16px;font:700 1.25rem var(--f-display);
  box-shadow:3px 3px 0 var(--shadow-c);font-variant-numeric:tabular-nums;
}
.cta:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.cta:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.btn{border:2px solid var(--frame);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:2px 2px 0 var(--shadow-c)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;min-height:56px;padding:0 16px;font-weight:700}

/* Ticket de venta */
.ticket{background:var(--surface);border:2px solid var(--frame);border-radius:16px;box-shadow:3px 3px 0 var(--shadow-c);padding:16px}
@media (min-width:900px){
  .ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);max-height:calc(100vh - 116px);overflow:auto}
}
@media (max-width:899px){
  .ticket{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:20px 20px 0 0;border-bottom:0;box-shadow:none;
    max-height:92vh;max-height:92dvh;overflow-y:auto;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .ticket.open{display:block;animation:up .22s ease-out}
  .t-ghost{display:none}
}
#scrim{display:none;position:fixed;inset:0;z-index:19;background:rgba(8,16,12,.55)}
@media (max-width:899px){#scrim.on{display:block}}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.t-eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-name{font:700 1.7rem/1.1 var(--f-display);overflow-wrap:anywhere;text-wrap:balance}
.x{width:44px;height:44px;flex:none;border:2px solid var(--frame);background:var(--surface-2);border-radius:12px;font-size:1.1rem;font-weight:700}
.t-sub{margin-top:6px;color:var(--muted);font-size:.95rem}
.t-sub b{color:var(--ink)}
.qty{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;margin-top:14px}
.step,.qty-n{
  height:76px;border:2px solid var(--frame);border-radius:14px;color:var(--ink);font:700 2.6rem var(--f-display);
  box-shadow:2px 2px 0 var(--shadow-c);font-variant-numeric:tabular-nums;
}
.step{background:var(--surface-2)}
.qty-n{background:var(--surface);font-size:2.8rem;min-width:0}
.step:active{transform:translate(2px,2px);box-shadow:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.chip{height:46px;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;font-weight:700}
.price-btn{
  width:100%;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;
  padding:10px 14px;border:2px solid var(--frame);border-radius:14px;background:var(--surface);
}
.price-btn span{font-size:.85rem;font-weight:700;color:var(--muted)}
.price-btn b{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.perf{border-top:3px dashed var(--line);margin:16px -2px}
.bigs{display:grid;gap:10px}
.big{border:2px solid var(--frame);border-radius:14px;padding:10px 14px;background:var(--surface-2);min-width:0}
.big span{display:block;font-size:.8rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big b{display:block;font:700 clamp(2.4rem,10vw,3.4rem)/1.05 var(--f-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big small{display:block;margin-top:2px;font-weight:600;color:var(--muted)}
.big.gain{background:var(--gain-bg);border-color:var(--gain)}
.big.gain b{color:var(--gain)}
.big.loss{background:var(--loss-bg);border-color:var(--loss)}
.big.loss b{color:var(--loss)}
.hint{margin-top:10px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 12px}
.hint.bad{color:var(--loss);background:var(--loss-bg)}
.sell-wrap{margin-top:14px}
.lot{margin-top:16px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.lot h3{font:700 .8rem var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lot div{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.lot b{font-variant-numeric:tabular-nums;text-align:right}
.lot .g{font-weight:700;color:var(--gain)}
.lot .g b{color:var(--gain)}
.lot .g.neg,.lot .g.neg b{color:var(--loss)}
.t-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.t-actions .link{padding:6px 0}
.t-actions .link.red{color:var(--loss)}
.t-ghost{padding:28px 8px;text-align:center;display:grid;gap:8px;justify-items:center}
.t-ghost h2{font:700 1.4rem var(--f-display)}
.t-ghost p{color:var(--muted);max-width:30ch}

/* Dock inferior */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:2px solid var(--frame);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.dock span{color:var(--muted);font-size:.85rem;font-weight:600}
.dock .btn{min-height:42px;padding:6px 14px;font-size:.95rem}

/* Hojas (inventario y teclado) */
.sheet{
  position:fixed;inset:0;z-index:30;background:rgba(8,16,12,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
}
#pad{z-index:40}
.sheet-card,.pad-card{
  width:min(560px,100%);max-height:94vh;max-height:94dvh;overflow-y:auto;background:var(--surface);
  border:2px solid var(--frame);border-bottom:0;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
  animation:up .22s ease-out;
}
@media (min-width:700px){
  .sheet{align-items:center}
  .sheet-card,.pad-card{border-bottom:2px solid var(--frame);border-radius:20px;padding-bottom:16px;box-shadow:5px 5px 0 var(--shadow-c)}
}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.sheet-head h2{font:700 1.4rem var(--f-display)}
.lab{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
#invDyn{display:grid;gap:12px;margin-top:12px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--frame);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);min-height:48px;font-weight:700;padding:6px 8px}
.seg button + button{border-left:2px solid var(--frame)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.fields{display:grid;gap:10px}
.fieldbtn{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;
  min-height:68px;padding:10px 14px;border:2px solid var(--frame);border-radius:14px;background:var(--surface);
}
.fieldbtn span{font-weight:700;color:var(--muted);font-size:.92rem;min-width:0}
.fieldbtn b{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.fieldbtn em{font:500 1rem var(--f-body);color:var(--muted);font-style:normal}
.eq{font-weight:700;color:var(--brand);padding-left:4px}
.calc{border:2px solid var(--frame);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--surface-2)}
.calc .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calc .row span{font-weight:600;color:var(--muted)}
.calc .row b{font:700 1.4rem var(--f-display);font-variant-numeric:tabular-nums;text-align:right}
.calc .row b small{font:600 .85rem var(--f-body);margin-left:4px}
.calc .row.gain b{color:var(--gain)}
.calc .row.loss b{color:var(--loss)}
.calc .row.bigrow b{font-size:1.9rem}
.fine{color:var(--muted);font-size:.9rem}

/* Teclado numérico */
.pad-card{width:min(420px,100%)}
.pad-label{font-weight:700;color:var(--muted);margin-bottom:8px}
.pad-disp{
  display:flex;align-items:baseline;justify-content:flex-end;gap:10px;border:2px solid var(--frame);border-radius:14px;
  background:var(--surface-2);padding:10px 14px;font:700 2.8rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;min-height:72px;overflow:hidden
}
.pad-disp .u{font-size:1.2rem;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{height:62px;border:2px solid var(--frame);border-radius:12px;background:var(--surface);font:700 1.8rem var(--f-display);box-shadow:2px 2px 0 var(--shadow-c)}
.key:active{transform:translate(2px,2px);box-shadow:none}
.key:disabled{opacity:.35}
.pad-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:12px}
.pad-actions .cta{min-height:56px}

#toast{
  position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;
  max-width:min(92vw,460px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--loss);color:#fff}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Caja y Stock</div>
    <div class="status loading" id="status" role="status">Conectando…</div>
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Buscar producto para vender" autocomplete="off" enterkeyhint="search" aria-label="Buscar producto">
      <button type="button" class="mic" data-mic="q" hidden aria-label="Buscar hablando">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <div class="left">
      <section id="today" class="today frame" aria-label="Resumen de hoy"></section>
      <section id="catalog" aria-label="Productos"></section>
    </div>
    <aside id="ticket" class="ticket" aria-label="Venta"></aside>
  </main>
</div>

<div id="scrim" data-act="closeTicket"></div>

<div class="dock">
  <span id="dockInfo">0 productos</span>
  <button type="button" class="btn primary" data-act="openInv">+ Registrar inventario</button>
</div>

<div class="sheet" id="inv" role="dialog" aria-modal="true" aria-labelledby="invT" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <h2 id="invT">Registrar inventario</h2>
      <button type="button" class="x" data-act="closeInv" aria-label="Cerrar">✕</button>
    </div>
    <label class="lab" for="invName">Nombre del producto</label>
    <div class="name-row">
      <input id="invName" type="text" autocomplete="off" placeholder="Ej: Gaseosa 2 L">
      <button type="button" class="mic" data-mic="invName" hidden aria-label="Decir el nombre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
    </div>
    <div id="invDyn"></div>
  </div>
</div>

<div class="sheet" id="pad" role="dialog" aria-modal="true" aria-label="Teclado numérico" hidden>
  <div class="pad-card">
    <div class="pad-label" id="padLabel"></div>
    <div class="pad-disp"><span class="u" id="padUnit"></span><span id="padVal">0</span></div>
    <div class="keys">
      <button type="button" class="key" data-k="7">7</button><button type="button" class="key" data-k="8">8</button><button type="button" class="key" data-k="9">9</button>
      <button type="button" class="key" data-k="4">4</button><button type="button" class="key" data-k="5">5</button><button type="button" class="key" data-k="6">6</button>
      <button type="button" class="key" data-k="1">1</button><button type="button" class="key" data-k="2">2</button><button type="button" class="key" data-k="3">3</button>
      <button type="button" class="key" data-k="," id="keyComma">,</button><button type="button" class="key" data-k="0">0</button><button type="button" class="key" data-k="bs" aria-label="Borrar">⌫</button>
    </div>
    <div class="pad-actions">
      <button type="button" class="ghost" data-act="padCancel">Cancelar</button>
      <button type="button" class="cta" data-act="padDone">Listo</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var NF2,NF1,NFQ;
try{
  NF2=new Intl.NumberFormat('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
  NF1=new Intl.NumberFormat('es-BO',{maximumFractionDigits:1});
  NFQ=new Intl.NumberFormat('es-BO',{maximumFractionDigits:2});
}catch(e){
  NF2=new Intl.NumberFormat('es',{minimumFractionDigits:2,maximumFractionDigits:2});
  NF1=new Intl.NumberFormat('es',{maximumFractionDigits:1});
  NFQ=new Intl.NumberFormat('es',{maximumFractionDigits:2});
}
function r2(x){return Math.round(x*100)/100}
function r4(x){return Math.round(x*10000)/10000}
function money(n){if(!isFinite(n))n=0;if(Math.abs(n)<0.005)n=0;return 'Bs '+NF2.format(n)}
function signed(n){var v=r2(n);if(v>0)return '+ '+money(v);if(v<0)return '− '+money(-v);return money(0)}
function qtyf(n){return NFQ.format(n)}
function p2(n){return n<10?'0'+n:''+n}
function dayKey(t){var d=t?new Date(t):new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function uid(pre){return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function narrow(){return window.matchMedia&&window.matchMedia('(max-width:899px)').matches}
function costoU(p){return p.unidadesComp>0?p.costoTotalComp/p.unidadesComp:0}
function vals(o){return Object.keys(o).map(function(k){return o[k]})}
function strip(o){var c={};Object.keys(o).forEach(function(k){if(k!=='id')c[k]=o[k]});return c}

/* ---------- estado ---------- */
var S={products:{},sales:{},sel:null,qty:1,open:false,q:'',status:'loading',showSales:false,confirmDel:false,confirmSale:null};
var F=newF();
function newF(){return {por:'unid',cant:0,cajas:0,porCaja:0,costo:0,precio:0,precioTouched:false,matchId:null,nombre:''}}
var store=null,chain=Promise.resolve(),lastDay=dayKey();

function enqueue(fn){
  chain=chain.then(fn).catch(function(e){toast('No se pudo guardar. Revisa tu conexión.','err');if(window.console)console.error(e)});
  return chain;
}
function need(){if(!store){toast('Conectando… intenta de nuevo en un momento.');return false}return true}

/* ---------- almacenamiento ---------- */
function cloudStore(db){
  var pc=db.collection('productos'),sc=db.collection('ventas');
  var timer=setTimeout(function(){if(S.status==='loading'){S.status='slow';renderStatus();renderCatalog()}},10000);
  function fail(e){clearTimeout(timer);S.status='error';renderStatus();renderCatalog();if(window.console)console.error(e)}
  pc.onSnapshot(function(snap){
    clearTimeout(timer);
    var m={};snap.docs.forEach(function(d){var v=d.data()||{};v.id=d.id;m[d.id]=v});
    S.products=m;S.status='cloud';afterData();
  },fail);
  sc.orderBy('ts','desc').limit(400).onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(d){var v=d.data()||{};v.id=d.id;m[d.id]=v});
    S.sales=m;renderAll();
  },fail);
  return {
    putP:function(p){return pc.doc(p.id).set(strip(p))},
    delP:function(id){return pc.doc(id).delete()},
    putS:function(s){return sc.doc(s.id).set(strip(s))},
    delS:function(id){return sc.doc(id).delete()}
  };
}
function localStore(){
  var KEY='caja-y-stock-v1';
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var o=JSON.parse(raw);(o.products||[]).forEach(function(p){S.products[p.id]=p});(o.sales||[]).forEach(function(s){S.sales[s.id]=s})}
  }catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({products:vals(S.products),sales:vals(S.sales)}))}catch(e){}return Promise.resolve()}
  return {putP:save,delP:save,putS:save,delS:save};
}
function putP(p){S.products[p.id]=p;renderAll();return enqueue(function(){return store.putP(p)})}
function putS(s){S.sales[s.id]=s;return enqueue(function(){return store.putS(s)})}
function afterData(){
  if(S.sel&&!S.products[S.sel]){S.sel=null;S.open=false}
  renderAll();
}

/* ---------- pintar ---------- */
var STATUS_TXT={loading:'Conectando…',cloud:'Guardado en tu cuenta',local:'Solo en este dispositivo',slow:'Sin conexión todavía',error:'Sin acceso a los datos'};
function renderStatus(){var el=$('#status');el.className='status '+S.status;el.textContent=STATUS_TXT[S.status]||''}
function renderAll(){renderStatus();renderToday();renderCatalog();renderTicket();if(!$('#inv').hidden)renderInv();syncLock()}

function todaySales(){
  var d=dayKey();
  return vals(S.sales).filter(function(s){return s.dia===d}).sort(function(a,b){return b.ts-a.ts});
}
function renderToday(){
  var list=todaySales(),tot=0,gan=0,uni=0;
  list.forEach(function(s){tot+=s.total;gan+=s.ganancia;uni+=s.cant});
  var date=new Date().toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'});
  var h='<div class="today-top"><h2>Hoy</h2><span class="date">'+esc(date)+'</span></div>';
  h+='<div class="nums"><div class="num"><span>Vendido</span><b>'+money(tot)+'</b></div>';
  h+='<div class="num '+(gan<0?'loss':'gain')+'"><span>Ganancia</span><b>'+signed(gan)+'</b></div></div>';
  h+='<p class="meta">'+(list.length?qtyf(uni)+(uni===1?' unidad vendida':' unidades vendidas')+' en '+list.length+(list.length===1?' venta':' ventas'):'Todavía no hay ventas hoy.')+'</p>';
  if(list.length){
    h+='<button type="button" class="link" data-act="toggleSales">'+(S.showSales?'Ocultar ventas de hoy':'Ver ventas de hoy ('+list.length+')')+'</button>';
    if(S.showSales){
      h+='<ul class="sales">';
      list.forEach(function(s){
        var hora=new Date(s.ts).toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'});
        var conf=S.confirmSale===s.id;
        h+='<li><div class="what">'+qtyf(s.cant)+' × '+esc(s.nombre)+'<small>'+esc(hora)+'</small></div>'
          +'<div class="amt">'+money(s.total)+'<small>'+signed(s.ganancia)+'</small></div>'
          +'<button type="button" class="mini'+(conf?' warn':'')+'" data-act="anular" data-sid="'+esc(s.id)+'">'+(conf?'¿Seguro? Toca otra vez':'Anular')+'</button></li>';
      });
      h+='</ul>';
    }
  }
  $('#today').innerHTML=h;
}

function tileHTML(p){
  var out=p.stock<=0,low=!out&&p.stock<=3;
  return '<button type="button" class="tile'+(S.sel===p.id?' sel':'')+(out?' out':'')+'" data-pid="'+esc(p.id)+'"><i class="hole" aria-hidden="true"></i>'
    +'<span class="tn">'+esc(p.nombre)+'</span><span class="tp">'+money(p.precio)+'</span>'
    +'<span class="ts'+(low?' low':'')+'">'+(out?'Agotado':'Quedan '+qtyf(p.stock))+'</span></button>';
}
function renderCatalog(){
  var all=vals(S.products);
  $('#dockInfo').textContent=all.length+(all.length===1?' producto':' productos');
  var el=$('#catalog'),h='';
  if(S.status==='loading'){
    h='<div class="frame empty"><h3>Conectando con tu inventario…</h3><p>Un momento, estamos cargando tus productos.</p></div>';
  }else if(S.status==='slow'&&!all.length){
    h='<div class="frame empty"><h3>Tarda más de lo normal</h3><p>No se pudo conectar todavía. Revisa tu internet; seguimos intentando.</p></div>';
  }else if(S.status==='error'&&!all.length){
    h='<div class="frame empty"><h3>No hay acceso a los datos</h3><p>Abre la página de nuevo desde tu cuenta para ver tu inventario.</p></div>';
  }else if(!all.length){
    h='<div class="frame empty"><h3>Todavía no hay productos</h3><p>Registra el primero con «Registrar inventario», en la barra de abajo. También puedes cargar tres productos de ejemplo para ver cómo funciona; los borras cuando quieras.</p>'
      +'<div class="row-btns"><button type="button" class="btn primary" data-act="openInv">+ Registrar inventario</button><button type="button" class="btn" data-act="example">Cargar ejemplos</button></div></div>';
  }else{
    var q=norm(S.q);
    var arr=all.filter(function(p){return !q||norm(p.nombre).indexOf(q)>-1}).sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es')});
    h='<div class="cat-head"><h2>Productos</h2><span>'+(q?arr.length+' de '+all.length:all.length)+'</span></div>';
    if(!arr.length){
      h+='<div class="frame empty"><h3>No hay «'+esc(S.q.trim())+'»</h3><p>Ese producto no está en tu inventario.</p><button type="button" class="btn primary" data-act="newFromSearch">Registrar «'+esc(S.q.trim())+'»</button></div>';
    }else{
      h+='<div class="grid">'+arr.map(tileHTML).join('')+'</div>';
    }
  }
  el.innerHTML=h;
}

function renderTicket(){
  var el=$('#ticket'),p=S.sel&&S.products[S.sel];
  el.classList.toggle('open',!!(S.open&&p));
  $('#scrim').classList.toggle('on',!!(S.open&&p));
  if(!p){
    el.innerHTML='<div class="t-ghost"><h2>Elige un producto</h2><p>Toca uno de la lista y aquí verás el total a cobrar y tu ganancia al instante.</p></div>';
    return;
  }
  var cu=costoU(p),q=S.qty,total=q*p.precio,g=total-q*cu,gu=p.precio-cu,mar=p.precio>0?gu/p.precio*100:0;
  var lotGain=p.unidadesComp*p.precio-p.costoTotalComp;
  var none=p.stock<=0,over=!none&&q>p.stock+1e-9,zero=!(q>0);
  var bad=g<0;
  var h='<div class="t-head"><div><div class="t-eyebrow">Vendiendo</div><h2 class="t-name">'+esc(p.nombre)+'</h2></div><button type="button" class="x" data-act="closeTicket" aria-label="Cerrar">✕</button></div>';
  h+='<p class="t-sub">Quedan <b>'+qtyf(p.stock)+'</b> · Costo por unidad <b>'+money(cu)+'</b></p>';
  h+='<div class="qty"><button type="button" class="step" data-act="dec" aria-label="Una menos">−</button><button type="button" class="qty-n" data-act="padQty" aria-label="Cantidad: '+esc(qtyf(q))+'. Toca para cambiar">'+qtyf(q)+'</button><button type="button" class="step" data-act="inc" aria-label="Una más">+</button></div>';
  h+='<div class="chips"><button type="button" class="chip" data-add="1">+1</button><button type="button" class="chip" data-add="5">+5</button><button type="button" class="chip" data-add="10">+10</button></div>';
  h+='<button type="button" class="price-btn" data-act="padPrice"><span>Precio de venta por unidad<br>(toca para cambiar)</span><b>'+money(p.precio)+'</b></button>';
  h+='<div class="perf"></div>';
  h+='<div class="bigs"><div class="big"><span>Total a cobrar</span><b>'+money(total)+'</b></div>';
  h+='<div class="big '+(bad?'loss':'gain')+'"><span>Ganancia de esta venta</span><b>'+signed(g)+'</b><small>'+signed(gu)+' por unidad · '+NF1.format(mar)+'% de margen</small></div></div>';
  if(bad)h+='<p class="hint bad">Estás vendiendo por debajo del costo.</p>';
  var cant=none||over||zero;
  if(none)h+='<p class="hint bad">Agotado. Repón stock para seguir vendiendo.</p>';
  else if(over)h+='<p class="hint bad">Solo quedan '+qtyf(p.stock)+'. Baja la cantidad.</p>';
  else if(zero)h+='<p class="hint">Pon una cantidad para vender.</p>';
  h+='<div class="sell-wrap"><button type="button" class="cta" data-act="sell"'+(cant?' disabled':'')+'>Registrar venta · '+money(total)+'</button></div>';
  h+='<div class="lot"><h3>Todo el lote</h3>'
    +'<div><span>Invertiste en total</span><b>'+money(p.costoTotalComp)+'</b></div>'
    +'<div><span>Venta total ('+qtyf(p.unidadesComp)+' u. × '+money(p.precio)+')</span><b>'+money(p.unidadesComp*p.precio)+'</b></div>'
    +'<div class="g'+(lotGain<0?' neg':'')+'"><span>Ganancia bruta</span><b>'+signed(lotGain)+'</b></div></div>';
  h+='<div class="t-actions"><button type="button" class="link" data-act="reponer">Reponer stock</button>'
    +'<button type="button" class="link red" data-act="del">'+(S.confirmDel?'Toca otra vez para eliminar':'Eliminar producto')+'</button></div>';
  el.innerHTML=h;
}

function syncLock(){
  var on=!$('#inv').hidden||!$('#pad').hidden||(S.open&&S.sel&&narrow());
  document.documentElement.classList.toggle('lock',!!on);
}

/* ---------- toast ---------- */
var toastT=null;
function toast(msg,kind){
  var t=$('#toast');t.textContent=msg;t.className='show'+(kind==='err'?' err':'');
  clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},3400);
}

/* ---------- venta ---------- */
function selectP(id){
  S.sel=id;S.qty=1;S.open=true;S.confirmDel=false;
  renderCatalog();renderTicket();syncLock();
}
function sell(){
  if(!need())return;
  var p=S.products[S.sel];if(!p)return;
  var q=S.qty;if(!(q>0)||q>p.stock+1e-9)return;
  var cu=costoU(p),tot=q*p.precio,g=tot-q*cu;
  var sale={id:uid('v'),pid:p.id,nombre:p.nombre,cant:q,precio:p.precio,costoUnit:r4(cu),total:r2(tot),ganancia:r2(g),ts:Date.now(),dia:dayKey()};
  var np=Object.assign({},p,{stock:r2(p.stock-q)});
  S.qty=1;S.open=false;
  putS(sale);putP(np);
  toast('Venta registrada · ganaste '+money(g));
}
function anular(id){
  if(S.confirmSale!==id){S.confirmSale=id;renderToday();return}
  if(!need())return;
  var s=S.sales[id];S.confirmSale=null;if(!s)return;
  var p=S.products[s.pid];
  delete S.sales[id];
  enqueue(function(){return store.delS(id)});
  if(p)putP(Object.assign({},p,{stock:r2(p.stock+s.cant)}));else renderAll();
  toast('Venta anulada. El stock volvió.');
}
function delProduct(){
  if(!S.confirmDel){S.confirmDel=true;renderTicket();return}
  if(!need())return;
  var id=S.sel;delete S.products[id];S.sel=null;S.open=false;S.confirmDel=false;
  enqueue(function(){return store.delP(id)});
  renderAll();toast('Producto eliminado.');
}

/* ---------- teclado numérico ---------- */
var pad={str:'0',fresh:true,cb:null,int:false};
function openPad(o){
  pad={str:o.value>0?String(o.value).replace('.',','):'0',fresh:true,cb:o.cb,int:!!o.int};
  $('#padLabel').textContent=o.label;$('#padUnit').textContent=o.unit||'';
  $('#keyComma').disabled=pad.int;
  $('#padVal').textContent=pad.str;
  $('#pad').hidden=false;syncLock();
  var d=$('#pad [data-act="padDone"]');if(d)d.focus();
}
function padKey(k){
  var s=pad.str;
  if(k==='bs'){s=s.length>1?s.slice(0,-1):'0';pad.fresh=false}
  else if(k===','){if(pad.int)return;if(pad.fresh){s='0,'}else if(s.indexOf(',')<0){s+=','}pad.fresh=false}
  else{
    if(pad.fresh||s==='0'){s=k}else{
      var i=s.indexOf(',');
      if(i>-1&&s.length-i>2)return;
      if(s.length>=9)return;
      s+=k;
    }
    pad.fresh=false;
  }
  pad.str=s;$('#padVal').textContent=s;
}
function closePad(apply){
  if($('#pad').hidden)return;
  var v=parseFloat(pad.str.replace(',','.'))||0,cb=pad.cb;
  $('#pad').hidden=true;pad.cb=null;syncLock();
  if(apply&&cb)cb(v);
}

/* ---------- registrar inventario ---------- */
function matchProd(name){
  var n=norm(name);if(!n)return null;
  var all=vals(S.products);
  for(var i=0;i<all.length;i++){if(norm(all[i].nombre)===n)return all[i]}
  return null;
}
function calcInv(){
  var ex=matchProd(F.nombre);
  var units=F.por==='caja'?r2(F.cajas*F.porCaja):F.cant;
  var tu=(ex?ex.unidadesComp:0)+units,tc=(ex?ex.costoTotalComp:0)+F.costo;
  var cu=tu>0?tc/tu:0,gu=F.precio-cu,mar=F.precio>0?gu/F.precio*100:0,bruta=tu*F.precio-tc;
  var miss=[];
  if(!F.nombre.trim())miss.push('el nombre');
  if(!(units>0))miss.push('la cantidad');
  if(!(F.costo>0))miss.push('el costo total');
  if(!(F.precio>0))miss.push('el precio de venta');
  return {ex:ex,units:units,tu:tu,tc:tc,cu:cu,gu:gu,mar:mar,bruta:bruta,miss:miss,ok:!miss.length,ready:units>0&&F.costo>0};
}
function fieldBtn(key,label,val,unit){
  var shown=val>0?(unit==='Bs'?money(val):qtyf(val)):'<em>Toca para poner</em>';
  return '<button type="button" class="fieldbtn" data-pad="'+key+'"><span>'+label+'</span><b>'+shown+'</b></button>';
}
function renderInv(){
  var c=calcInv();
  if(c.ex&&F.matchId!==c.ex.id){F.matchId=c.ex.id;if(!F.precioTouched)F.precio=c.ex.precio;c=calcInv()}
  if(!c.ex)F.matchId=null;
  var h='';
  if(c.ex)h+='<p class="note">Ya tienes «'+esc(c.ex.nombre)+'» (quedan '+qtyf(c.ex.stock)+'). Lo que registres se suma al stock.</p>';
  h+='<div class="seg" role="group" aria-label="Cómo compraste">'
    +'<button type="button" data-por="unid" class="'+(F.por==='unid'?'on':'')+'" aria-pressed="'+(F.por==='unid')+'">Por unidades</button>'
    +'<button type="button" data-por="caja" class="'+(F.por==='caja'?'on':'')+'" aria-pressed="'+(F.por==='caja')+'">Por cajas o paquetes</button></div>';
  h+='<div class="fields">';
  if(F.por==='unid'){h+=fieldBtn('cant','Cantidad de unidades',F.cant,'')}
  else{
    h+=fieldBtn('cajas','Cajas o paquetes',F.cajas,'')+fieldBtn('porCaja','Unidades por caja o paquete',F.porCaja,'');
    h+='<p class="eq">'+(c.units>0?'= '+qtyf(c.units)+' unidades en total':'Pon las cajas y cuántas unidades trae cada una')+'</p>';
  }
  h+=fieldBtn('costo','Costo total de toda la compra',F.costo,'Bs')+fieldBtn('precio','Precio de venta por unidad',F.precio,'Bs');
  h+='</div>';
  if(c.ready){
    h+='<div class="calc"><div class="row"><span>Costo por unidad'+(c.ex?' (promedio)':'')+'</span><b>'+money(c.cu)+'</b></div>';
    if(F.precio>0){
      h+='<div class="row '+(c.gu<0?'loss':'gain')+'"><span>Ganancia por unidad</span><b>'+signed(c.gu)+'<small>'+NF1.format(c.mar)+'%</small></b></div>';
      h+='<div class="row bigrow '+(c.bruta<0?'loss':'gain')+'"><span>Ganancia bruta del lote</span><b>'+signed(c.bruta)+'</b></div>';
      h+='<p class="fine">Venta total '+money(c.tu*F.precio)+' − compra total '+money(c.tc)+'</p>';
    }else{
      h+='<p class="fine">Pon el precio de venta para ver tu ganancia.</p>';
    }
    h+='</div>';
  }else{
    h+='<p class="fine">Pon la cantidad y el costo total: el costo por unidad y tu ganancia aparecen solos.</p>';
  }
  h+='<button type="button" class="cta" data-act="saveInv"'+(c.ok?'':' disabled')+'>'+(c.ex?'Sumar al stock':'Guardar producto')+'</button>';
  if(!c.ok)h+='<p class="fine">Falta: '+c.miss.join(', ')+'.</p>';
  $('#invDyn').innerHTML=h;
}
function openInv(name){
  if(typeof name==='string'){F=newF();F.nombre=name}
  $('#invName').value=F.nombre;
  $('#inv').hidden=false;renderInv();syncLock();
  $('#inv .sheet-card').scrollTop=0;
}
function closeInv(){$('#inv').hidden=true;syncLock()}
function saveInv(){
  if(!need())return;
  var c=calcInv();if(!c.ok)return;
  var p,ex=c.ex;
  if(ex){
    p=Object.assign({},ex,{stock:r2(ex.stock+c.units),unidadesComp:r2(ex.unidadesComp+c.units),costoTotalComp:r4(ex.costoTotalComp+F.costo),precio:F.precio});
  }else{
    p={id:uid('p'),nombre:F.nombre.trim(),stock:c.units,unidadesComp:c.units,costoTotalComp:r4(F.costo),precio:F.precio,ts:Date.now()};
  }
  putP(p);
  F=newF();$('#invName').value='';closeInv();
  toast(ex?'Stock sumado a '+p.nombre+'.':p.nombre+' guardado.');
}
function addExamples(){
  if(!need())return;
  [['Gaseosa 2 L (ejemplo)',24,168,9],['Galletas paquete (ejemplo)',12,54,6],['Agua 600 ml (ejemplo)',48,96,3.5]].forEach(function(e){
    putP({id:uid('p'),nombre:e[0],stock:e[1],unidadesComp:e[1],costoTotalComp:e[2],precio:e[3],ts:Date.now()});
  });
  toast('Listo. Son ejemplos: bórralos cuando quieras.');
}

/* ---------- dictado ---------- */
var dict=null,dictTarget=null,listening=false;
function setupDict(){
  if(!dict)return;
  $$('[data-mic]').forEach(function(b){b.hidden=false});
  dict.onFinal(function(r){
    if(!dictTarget||!r||!r.text)return;
    var t=String(r.text).trim().replace(/[.,;!?]+$/,'');
    dictTarget.value=(dictTarget.value?dictTarget.value+' ':'')+t;
    dictTarget.dispatchEvent(new Event('input',{bubbles:true}));
  });
  dict.onState(function(s){
    listening=s.state==='listening';
    $$('[data-mic]').forEach(function(b){b.classList.toggle('on',listening&&dictTarget&&b.dataset.mic===dictTarget.id)});
  });
}
function micClick(id){
  if(!dict)return;
  if(listening){dict.stop();return}
  dictTarget=document.getElementById(id);
  var pr=dict.start();
  if(pr&&pr.catch)pr.catch(function(e){if(e&&e.code==='not_granted')toast('El micrófono no está permitido. Puedes escribir.')});
}

/* ---------- eventos ---------- */
function hit(el){
  while(el&&el!==document){
    var d=el.dataset;
    if(d&&(d.act||d.pid||d.pad||d.por||d.add||d.mic||d.k!==undefined))return el;
    el=el.parentNode;
  }
  return null;
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('sheet')){
    if(t.id==='pad')closePad(false);else if(t.id==='inv')closeInv();
    return;
  }
  var h=hit(t);if(!h)return;
  var d=h.dataset;
  if(d.k!==undefined){padKey(d.k);return}
  if(d.pid){selectP(d.pid);return}
  if(d.add){S.qty=r2(S.qty+Number(d.add));renderTicket();return}
  if(d.por){F.por=d.por;renderInv();return}
  if(d.pad){
    var cfg={
      cant:{label:'Cantidad de unidades'},
      cajas:{label:'Cajas o paquetes',int:true},
      porCaja:{label:'Unidades por caja o paquete'},
      costo:{label:'Costo total de toda la compra',unit:'Bs'},
      precio:{label:'Precio de venta por unidad',unit:'Bs'}
    }[d.pad];
    var key=d.pad;
    openPad({label:cfg.label,unit:cfg.unit,int:cfg.int,value:F[key],cb:function(v){F[key]=v;if(key==='precio')F.precioTouched=true;renderInv()}});
    return;
  }
  if(d.mic){micClick(d.mic);return}
  switch(d.act){
    case 'dec':if(S.qty>1){S.qty=r2(S.qty-1);renderTicket()}break;
    case 'inc':S.qty=r2(S.qty+1);renderTicket();break;
    case 'padQty':openPad({label:'Cantidad a vender',value:S.qty,cb:function(v){S.qty=v;renderTicket()}});break;
    case 'padPrice':{
      var p=S.products[S.sel];if(!p)break;
      openPad({label:'Precio de venta por unidad',unit:'Bs',value:p.precio,cb:function(v){if(v>0&&need())putP(Object.assign({},p,{precio:v}))}});
      break;
    }
    case 'sell':sell();break;
    case 'closeTicket':S.open=false;renderTicket();syncLock();break;
    case 'reponer':{var q=S.products[S.sel];if(q){S.open=false;renderTicket();openInv(q.nombre)}break}
    case 'del':delProduct();break;
    case 'toggleSales':S.showSales=!S.showSales;S.confirmSale=null;renderToday();break;
    case 'anular':anular(d.sid);break;
    case 'openInv':openInv();break;
    case 'closeInv':closeInv();break;
    case 'saveInv':saveInv();break;
    case 'example':addExamples();break;
    case 'newFromSearch':{var nm=S.q.trim();$('#q').value='';S.q='';renderCatalog();openInv(nm);break}
    case 'padDone':closePad(true);break;
    case 'padCancel':closePad(false);break;
  }
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;renderCatalog()});
$('#q').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var q=norm(S.q);if(!q)return;
  var m=vals(S.products).filter(function(p){return norm(p.nombre).indexOf(q)>-1});
  if(m.length===1){selectP(m[0].id);e.target.blur()}
});
$('#invName').addEventListener('input',function(e){F.nombre=e.target.value;renderInv()});
document.addEventListener('keydown',function(e){
  if(!$('#pad').hidden){
    if(e.key>='0'&&e.key<='9'&&e.key.length===1){padKey(e.key)}
    else if(e.key===','||e.key==='.'){padKey(',')}
    else if(e.key==='Backspace'){e.preventDefault();padKey('bs')}
    else if(e.key==='Enter'){e.preventDefault();closePad(true)}
    else if(e.key==='Escape'){closePad(false)}
    return;
  }
  if(e.key==='Escape'){
    if(!$('#inv').hidden)closeInv();
    else if(S.open){S.open=false;renderTicket();syncLock()}
  }
});

/* ---------- arranque ---------- */
function start(){
  renderAll();
  var c=window.claude,dbP=Promise.resolve(null),dictP=Promise.resolve(null);
  try{if(c&&c.use){dbP=c.use('db');dictP=c.use('dictation')}}catch(e){}
  dictP.then(function(d){dict=d||null;setupDict()}).catch(function(){});
  dbP.then(function(db){
    if(db){store=cloudStore(db)}
    else{store=localStore();S.status='local';afterData()}
  }).catch(function(){store=localStore();S.status='local';afterData()});
  setInterval(function(){if(dayKey()!==lastDay){lastDay=dayKey();renderToday()}},60000);
}
start();
})();
</script>
